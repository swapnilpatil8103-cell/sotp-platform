# docker compose up --build
# Reads secrets from .env in this directory (see .env.example); AUTH_JWT_SECRET is required.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sotp_intelligence
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sotp_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/sotp_intelligence
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET (>= 32 chars) in .env}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LSE_API_KEY: ${LSE_API_KEY:-}
      LSE_API_BASE_URL: ${LSE_API_BASE_URL:-https://api.londonstrategicedge.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_TOKEN_MINUTES: ${AUTH_TOKEN_MINUTES:-60}
    ports:
      - "8000:8000"

  web:
    build:
      context: apps/web
    environment:
      API_BASE_URL: http://backend:8000
      # Served over plain http on localhost; set true (the default for production
      # builds) behind HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
