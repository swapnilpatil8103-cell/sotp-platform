name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    env:
      # The suite never calls SEC; this only satisfies the env-var presence check.
      SEC_USER_AGENT: "CI Dummy ci@example.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      # Pinned to the versions the suite was verified against (backend/constraints.txt).
      # The weekly "Dependency drift" workflow covers newer releases.
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt
      # Integration tests hit the real SEC EDGAR API and are excluded here.
      - run: pytest -m "not integration" -ra --tb=short --junitxml=pytest.xml
      # Raw logs need a GitHub sign-in; annotations and the summary do not.
      - name: Summarise failures
        if: failure()
        run: python .github/scripts/summarize_junit.py pytest.xml

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sotp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sotp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEC_USER_AGENT: "CI Dummy ci@example.com"
      # The database name must end in "_test": every test drops and recreates all tables in it.
      # A bare postgresql:// URL is fine; backend/db.py pins it to psycopg2.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sotp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt
      - run: pytest -m "not integration" -ra --tb=short --junitxml=pytest.xml
      # Raw logs need a GitHub sign-in; annotations and the summary do not.
      - name: Summarise failures
        if: failure()
        run: python .github/scripts/summarize_junit.py pytest.xml

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --omit=dev --audit-level=high
